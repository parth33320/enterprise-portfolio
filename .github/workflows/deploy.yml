name: Deploy Sales Engineering Factory Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  compile-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Merged PR Assets
        uses: actions/checkout@v4

      - name: Initialize Runtime Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Static Index Assembly Compiler
        run: node scripts/compile-portfolio.js

      - name: Stage Production Static Bundle
        run: |
          mkdir -p build-dist
          cp -r public/* build-dist/
          mkdir -p build-dist/docs/assets || true
          # Safely deliver the pre-baked GIF that Jules generated in the PR branch
          cp docs/assets/* build-dist/docs/assets/ || true

      - name: Upload Static Pages Package Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build-dist'

      - name: Export Downloadable Tailored Resumes Package
        uses: actions/upload-artifact@v4
        with:
          name: Tailored-Resumes-Package
          path: './dist_resumes/'

  deploy-to-github-pages-surface:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: compile-and-publish
    steps:
      - name: Execute GitHub Pages Deployment Handshake
        id: deployment
        uses: actions/deploy-pages@v4

